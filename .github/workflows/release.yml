name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test

      - name: Check tag matches package.json version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Extract changelog section
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          awk -v ver="## [$PKG_VERSION]" '
            $0 ~ "^" ver { found=1; print; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "::error::No CHANGELOG.md section found for version $PKG_VERSION"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: sifter-chrome-zip
          path: .output/sifter-*-chrome.zip

      - uses: softprops/action-gh-release@v2
        with:
          files: .output/sifter-*-chrome.zip
          body_path: RELEASE_NOTES.md
