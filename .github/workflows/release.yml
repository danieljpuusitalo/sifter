name: Release

# A push to main whose package.json version has no tag yet IS the release
# (`pnpm release patch` opens that PR; docs/RELEASING.md). It re-runs every check,
# tags v<version>, publishes the GitHub Release with the zip, then submits the zip to
# the Chrome Web Store. Do not push v* tags by hand: a tag that already exists makes
# this workflow skip the release.
#
# The store step is its own job so that a refused submission (one review at a time,
# or a review still pending) is retried with "Re-run failed jobs", which reuses the
# zip and the tag. Without the CWS_* secrets it does nothing and says so.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" >/dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "v$VERSION is already released; nothing to do."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "v$VERSION has no tag: releasing it."
          fi

  release:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm build
      - run: node scripts/check-permissions.mjs
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test

      - name: Extract changelog section
        run: |
          awk -v ver="## [$VERSION]" '
            index($0, ver) == 1 { found=1; print; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md | tr -d '\r' > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "::error::No CHANGELOG.md section found for version $VERSION"
            exit 1
          fi
          test -f ".output/sifter-$VERSION-chrome.zip" || { echo "::error::No .output/sifter-$VERSION-chrome.zip"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: sifter-chrome-zip
          path: .output/sifter-${{ needs.check.outputs.version }}-chrome.zip

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ needs.check.outputs.version }}
          files: .output/sifter-${{ needs.check.outputs.version }}-chrome.zip
          body_path: RELEASE_NOTES.md

  store:
    needs: [check, release]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
      CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
      CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
      REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
      PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
      EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sifter-chrome-zip
      - name: Submit to the Chrome Web Store
        run: |
          if [ -z "$REFRESH_TOKEN" ] || [ -z "$EXTENSION_ID" ]; then
            echo "::notice::No CWS_* secrets: upload sifter-$VERSION-chrome.zip from the GitHub Release by hand (docs/RELEASING.md)."
            exit 0
          fi
          # Upload, then submit for review; it goes live by itself once approved.
          npx --yes chrome-webstore-upload-cli@4.0.2 --source "sifter-$VERSION-chrome.zip" --extension-id "$EXTENSION_ID"
